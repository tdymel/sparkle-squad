[workspace]

[package]
name = "sparkle-squad"
version = "0.1.0"
authors = ["Tom <tom@dymel.dev>"]
edition = "2021"

[dependencies]
dioxus = { version = "=0.8.0-alpha.2", features = ["router"] }
libero = { version = "0.2.0" }
comfy-i18n = "0.3"
pictogram-icons-lucide = "0.5"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
# No `strip`: it drops the sections wasm-bindgen 0.2.127 reads, and dx 0.8
# fails with "import ... doesn't have an adapter listed". wasm-opt strips anyway.
