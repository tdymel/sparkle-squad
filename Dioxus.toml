[application]

[web]
# Skip pre-compressed .gz/.br sidecar files: GitHub Pages ignores them and
# gzips text responses itself.
pre_compress = false

[web.wasm_opt]
# Smallest output; the site is static, so runtime speed is not the bottleneck.
level = "z"
debug = false
keep_names = false
memory_packing = true

[web.app]

# HTML title tag content
title = "Sparkle Squad - Mixed Volleyball Hamburg Hamm"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
