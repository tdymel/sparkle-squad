name: Deploy to GitHub Pages

on:
  push:
    branches: [main, new]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Load Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache Dioxus CLI
        id: cache-dioxus-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dioxus-cli-0.7.10

      - name: Install Dioxus CLI
        if: steps.cache-dioxus-cli.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli@0.7.10 --locked

      - name: Build
        run: dx build --platform web --release --debug-symbols=false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/dx/sparkle-squad/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
